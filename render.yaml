services:
  - type: web
    name: app-gestion-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.0
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AUTH_ENABLED
        value: "false"
      - key: AUTH_DEMO_BYPASS
        value: "true"
      - key: ADMIN_EMAIL
        sync: false
      - key: AZURE_AD_TENANT_ID
        sync: false
      - key: AZURE_AD_AUDIENCE
        sync: false
