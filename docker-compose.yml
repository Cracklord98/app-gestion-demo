version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: app-gestion-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=app_gestion_demo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_gestion_demo"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app-gestion-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/app_gestion_demo?schema=public
      - DIRECT_URL=postgresql://postgres:postgres@db:5432/app_gestion_demo?schema=public
      - CORS_ORIGIN=http://localhost:5173,http://localhost:4173
      - AUTH_ENABLED=false
      - AUTH_DEMO_BYPASS=true
      - ADMIN_EMAIL=admin@synaptica.local
    command: sh -c "npx prisma migrate deploy && npm run start"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: app-gestion-frontend
    ports:
      - "4173:4173"
    environment:
      - PORT=4173
      - VITE_API_URL=http://localhost:4000
      - VITE_FORCE_LOCAL_AUTH=true
    depends_on:
      - backend

volumes:
  pgdata:
